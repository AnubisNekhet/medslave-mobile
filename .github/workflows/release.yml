# Publishes a GitHub Release with the signed APK when a version tag is pushed: git tag v1.3 && git push origin v1.3
# The tag must match versionName in app/build.gradle.kts (v1.3 = "1.3"). Needs the signing secrets (README › CI): an unsigned or
# differently signed APK wouldn't install over the previous version, so the job stops without them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag and the signing secrets
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "$TAG" = "v$v" ] || { echo "::error::Tag $TAG doesn't match versionName $v (expected v$v)"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] \
            || { echo "::error::Signing secrets missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"; exit 1; }

      - name: Build the signed APK
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew assembleRelease
          rm -f release.keystore keystore.properties
          cp app/build/outputs/apk/release/app-release.apk "medslave-$TAG.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "medslave-$TAG.apk" --title "medslave $TAG" --generate-notes
