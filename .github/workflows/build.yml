# Builds the app on every push and pull request and keeps the APK as a downloadable artifact.
# With the signing secrets set (README › Signing), pushes build a signed release APK; without them (forks, PRs), a debug APK.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew assembleRelease
          rm -f release.keystore keystore.properties

      - name: Debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: medslave-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
